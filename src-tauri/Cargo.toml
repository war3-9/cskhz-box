[package]
name = "cskhz-open-source"
version = "1.1.2"
description = "超时空盒子开源版"
edition = "2021"
license = "AGPL-3.0-only"

[features]
default = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
aho-corasick = "1.1.5"
hkdf = "0.12"
hmac = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "blocking"] }
ttf-parser = "=0.25.1"
flate2 = "1"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }
tar = "0.4"
aes = "0.8"
aes-gcm = "0.10"
ctr = "0.9"
rsa = "0.9"
base64 = "0.22"
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_Security", "Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
